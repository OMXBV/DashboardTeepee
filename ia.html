<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Assistant IA · Omexom TeePee</title>
<link rel="stylesheet" href="omexom.css">
<style>
/* La page est un ecran de conversation : l'en-tete, puis le cadre de discussion qui
   prend toute la hauteur restante, puis une ligne de pied. Pas de defilement de page,
   c'est l'assistant qui defile a l'interieur de son cadre. */
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.site-header { flex: none; }

/* Etat de la connexion, dans l'en-tete : un point et un mot. */
.chat-state {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; color: var(--mid);
}
.chat-state::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow);
  box-shadow: 0 0 0 3px rgba(255,185,29,0.18); transition: background 0.3s, box-shadow 0.3s;
}
.chat-state.is-ready::before { background: var(--ok); box-shadow: 0 0 0 3px rgba(46,125,50,0.16); }
.chat-state + .site-cta { margin-left: 0; }

/* Le cadre de conversation. */
.chat-wrap { flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center; padding: 20px var(--gutter) 0; }
.chat-frame {
  position: relative; width: 100%; max-width: 1120px; min-height: 0;
  background: var(--white); border: 1px solid var(--border); border-radius: 3px;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,32,96,0.06);
}
.chat-frame::before {
  content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; z-index: 2;
  background: linear-gradient(90deg, var(--deep) 0%, var(--blue) 55%, var(--turq) 100%);
}
.chat-frame iframe { flex: 1; width: 100%; height: 100%; border: 0; display: block; background: var(--white); }

/* Voile de chargement : trois points qui respirent, le temps que l'assistant arrive.
   Il s'efface au chargement du cadre. */
.chat-veil {
  position: absolute; inset: 3px 0 0; z-index: 3; background: var(--white);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  transition: opacity 0.45s, visibility 0.45s;
}
.chat-veil.is-hidden { opacity: 0; visibility: hidden; }
.chat-veil-mark {
  width: 56px; height: 56px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  color: var(--blue); background: rgba(0,113,206,0.09);
}
.chat-veil-mark .ico { width: 28px; height: 28px; }
.chat-veil-title { font-size: 16px; font-weight: 900; color: var(--deep); line-height: 1.3; }
.chat-veil-sub { font-size: 12px; font-weight: 400; color: var(--mid); margin-top: 4px; }
.chat-veil-text { text-align: center; }
.chat-dots { display: flex; gap: 7px; }
.chat-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); opacity: 0.25; animation: chat-breathe 1.3s ease-in-out infinite; }
.chat-dots i:nth-child(2) { animation-delay: 0.2s; }
.chat-dots i:nth-child(3) { animation-delay: 0.4s; }
@keyframes chat-breathe { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .chat-dots i { animation: none; opacity: 0.6; } }

/* Pied : une ligne, sans cadre, pour ne pas voler de hauteur a la conversation. */
.chat-foot {
  flex: none; padding: 12px var(--gutter) 14px; text-align: center;
  font-size: 11px; font-weight: 400; color: var(--mid); letter-spacing: 0.3px;
}
.chat-foot b { font-weight: 700; color: var(--mid); }

@media (max-width: 820px) {
  .chat-state { margin-left: 0; }
}
@media (max-width: 560px) {
  .chat-wrap { padding: 12px 12px 0; }
  .chat-foot { padding: 10px 12px 12px; }
}
</style>
</head>
<body>

<header class="site-header">
  <img class="site-logo" src="img/omexom-logo.png" alt="Omexom" width="212" height="38">
  <div class="site-id">
    <div class="site-eyebrow">Omexom · Plateforme TeePee</div>
    <div class="site-title">Assistant IA</div>
  </div>
  <div class="chat-state" id="chat-state" role="status" aria-live="polite">Connexion</div>
  <button type="button" class="site-cta" id="chat-reset">Nouvelle conversation</button>
</header>

<div class="chat-wrap">
  <div class="chat-frame">
    <div class="chat-veil" id="chat-veil" aria-hidden="true">
      <div class="chat-veil-mark"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.6 4.4 4.4 1.6-4.4 1.6L12 15.5l-1.6-4.4L6 9.5l4.4-1.6z"/><path d="M5 16.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/><path d="M18.5 15.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg></div>
      <div class="chat-veil-text">
        <div class="chat-veil-title">Connexion à l'assistant</div>
        <div class="chat-veil-sub">La conversation s'ouvre dans un instant</div>
      </div>
      <div class="chat-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <iframe id="chat-iframe" title="Assistant IA Omexom"
      src="https://copilotstudio.microsoft.com/environments/Default-cae7d061-08f3-40dd-80c3-3c0b8889224a/bots/cr299_teepai_lnwQcJ/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
      allow="clipboard-write; microphone"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

<div class="chat-foot"><b>Assistant IA</b> · Les réponses sont générées automatiquement, à vérifier dans TeePee avant toute décision</div>

<script>
/* Le voile s'efface quand le cadre a charge, ou au bout de quelques secondes si
   l'evenement n'arrive pas : la page vit dans une iframe d'un autre domaine et le
   signal de chargement n'est pas toujours remonte. */
(function () {
  var cadre = document.getElementById('chat-iframe');
  var voile = document.getElementById('chat-veil');
  var etat = document.getElementById('chat-state');
  var bouton = document.getElementById('chat-reset');
  var src = cadre.getAttribute('src');
  var minuterie;
  function pret() {
    clearTimeout(minuterie);
    voile.classList.add('is-hidden');
    etat.classList.add('is-ready'); etat.textContent = 'En ligne';
  }
  function attendre() {
    voile.classList.remove('is-hidden');
    etat.classList.remove('is-ready'); etat.textContent = 'Connexion';
    clearTimeout(minuterie);
    minuterie = setTimeout(pret, 6000);
  }
  cadre.addEventListener('load', function () { setTimeout(pret, 400); });
  bouton.addEventListener('click', function () {
    attendre();
    cadre.setAttribute('src', 'about:blank');
    setTimeout(function () { cadre.setAttribute('src', src); }, 60);
  });
  attendre();
})();
</script>
</body>
</html>

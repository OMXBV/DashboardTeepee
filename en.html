@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_light.ttf') format('truetype'); font-weight: 300; font-style: normal; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_medium.ttf') format('truetype'); font-weight: 500; font-style: normal; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_black.ttf') format('truetype'); font-weight: 900; font-style: normal; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_extra_light.ttf') format('truetype'); font-weight: 200; font-style: normal; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_italic.ttf') format('truetype'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_bold_italic.ttf') format('truetype'); font-weight: 700; font-style: italic; }
@font-face { font-family: 'Vinci Sans'; src: url('vinci_sans_light_italic.ttf') format('truetype'); font-weight: 300; font-style: italic; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #0071CE; --turq: #00C1DE; --deep: #002060;
  --yellow: #FFB91D; --colvert: #007B99;
  --bg: #F4F7FB; --white: #FFFFFF;
  --text: #1C2333; --mid: #5A6978; --border: #E0E8F0;
}
body { font-family: 'Vinci Sans', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

.topbar {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 12px 28px; display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-logo { height: 32px; width: auto; display: block; }
.topbar-divider { width: 1px; height: 26px; background: var(--border); }
.topbar-entity { font-size: 11px; font-weight: 500; color: var(--mid); letter-spacing: 1.5px; text-transform: uppercase; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.teepee-badge {
  background: var(--blue); color: white;
  font-size: 9px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
  padding: 5px 16px 5px 12px;
  clip-path: polygon(0 0, 88% 0, 100% 100%, 12% 100%);
}

.triband { height: 4px; background: linear-gradient(to right, var(--blue) 65%, var(--turq) 65% 90%, var(--yellow) 90%); }

.hero {
  background: var(--deep); padding: 28px 28px 32px;
  position: relative; overflow: hidden;
}
.hero-deco { position: absolute; top: 0; bottom: 0; pointer-events: none; }
.hero-deco-1 { right: -30px; width: 320px; background: rgba(0,113,206,0.22); clip-path: polygon(16% 0,100% 0,84% 100%,0% 100%); }
.hero-deco-2 { right: 110px; width: 180px; background: rgba(0,193,222,0.16); clip-path: polygon(16% 0,100% 0,84% 100%,0% 100%); }
.hero-deco-3 { right: 220px; width: 100px; background: rgba(255,185,29,0.07); clip-path: polygon(16% 0,100% 0,84% 100%,0% 100%); }
.hero-inner { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.hero-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.hero-eyebrow-line { width: 24px; height: 2px; background: var(--turq); }
.hero-eyebrow-text { font-size: 9px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--turq); }
.hero-title { font-size: 26px; font-weight: 900; color: white; line-height: 1.1; margin-bottom: 5px; }
.hero-title em { color: var(--turq); font-style: normal; }
.hero-sub { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.50); }
.hero-stats { display: flex; gap: 0; flex-shrink: 0; }
.stat { text-align: right; padding: 0 22px; border-right: 1px solid rgba(255,255,255,0.12); }
.stat:last-child { border-right: none; padding-right: 0; }
.stat-n { font-size: 26px; font-weight: 900; color: white; line-height: 1; }
.stat-l { font-size: 9px; font-weight: 300; color: rgba(255,255,255,0.40); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }

.body-wrap { padding: 24px 28px 48px; }
.section-label {
  font-size: 9px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--mid); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.featured {
  background: var(--blue); border-radius: 3px;
  padding: 20px 26px; margin-bottom: 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: relative; overflow: hidden;
  cursor: pointer; transition: filter 0.18s; text-decoration: none;
}
.featured:hover { filter: brightness(1.08); }
.fd1 { position: absolute; right: -10px; top: 0; bottom: 0; width: 220px; background: rgba(255,255,255,0.07); clip-path: polygon(16% 0,100% 0,84% 100%,0% 100%); pointer-events: none; }
.fd2 { position: absolute; right: 80px; top: 0; bottom: 0; width: 120px; background: rgba(0,193,222,0.15); clip-path: polygon(16% 0,100% 0,84% 100%,0% 100%); pointer-events: none; }
.feat-left { position: relative; z-index: 1; }
.feat-title { font-size: 20px; font-weight: 900; color: white; margin-bottom: 4px; }
.feat-sub { font-size: 11px; font-weight: 300; color: rgba(255,255,255,0.60); }
.feat-btn {
  position: relative; z-index: 1;
  background: white; color: var(--blue);
  font-family: 'Vinci Sans', Arial, sans-serif;
  font-size: 10px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
  padding: 11px 22px 11px 16px; border: none; cursor: pointer;
  clip-path: polygon(0 0,88% 0,100% 100%,12% 100%);
  transition: background 0.15s; white-space: nowrap;
}
.feat-btn:hover { background: #EEF3F8; }

.quick-row { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin-bottom: 24px; }
.qcard {
  background: var(--white); border: 1px solid var(--border); border-radius: 3px;
  padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; text-decoration: none; color: inherit;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.12s;
}
.qcard:hover { border-color: var(--blue); box-shadow: 0 3px 12px rgba(0,113,206,0.09); transform: translateY(-1px); }
.qico { width: 32px; height: 32px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.ib { background: rgba(0,113,206,0.09); }
.it { background: rgba(0,193,222,0.09); }
.id { background: rgba(0,32,96,0.07); }
.iy { background: rgba(255,185,29,0.12); }
.io { background: rgba(224,90,0,0.09); }
.ql2 { font-size: 11px; font-weight: 500; color: var(--text); line-height: 1.3; }
.qs2 { font-size: 9px; font-weight: 300; color: var(--mid); margin-top: 1px; }

.menus-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px; }
.mcard {
  background: var(--white); border: 1px solid var(--border);
  border-top: 3px solid var(--blue); border-radius: 3px;
  padding: 16px 18px 18px; cursor: pointer; text-decoration: none;
  display: block; position: relative;
  transition: box-shadow 0.15s, transform 0.12s;
}
.mcard:hover { box-shadow: 0 5px 18px rgba(0,32,96,0.08); transform: translateY(-2px); }
.mcard.cm { border-top-color: var(--deep); }
.mcard.co { border-top-color: var(--blue); }
.mcard.cs { border-top-color: var(--turq); }
.mcard.ca { border-top-color: var(--yellow); }
.mc-count { position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: 500; color: var(--mid); background: var(--bg); padding: 2px 6px; border-radius: 2px; }
.badge { display: inline-block; font-size: 8px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; padding: 3px 12px 3px 7px; clip-path: polygon(0 0,88% 0,100% 100%,12% 100%); color: white; margin-bottom: 10px; }
.bm { background: var(--deep); } .bo { background: var(--blue); } .bs { background: var(--turq); } .ba { background: var(--yellow); color: var(--deep); }
.mc-t { font-size: 12px; font-weight: 900; color: var(--text); margin-bottom: 4px; line-height: 1.3; padding-right: 36px; }
.mc-d { font-size: 10px; font-weight: 300; color: var(--mid); line-height: 1.5; }

.projects-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 24px; }
.pcard { background: var(--white); border: 1px solid var(--border); border-radius: 3px; padding: 14px 16px; text-decoration: none; color: inherit; display: block; transition: box-shadow 0.15s, transform 0.12s; }
.pcard:hover { box-shadow: 0 4px 16px rgba(0,32,96,0.10); transform: translateY(-2px); border-color: var(--blue); }
.pc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pc-badge { font-size: 8px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; }
.pc-power { font-size: 11px; font-weight: 500; color: var(--mid); }
.pc-name { font-size: 13px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
.pc-ct { font-size: 10px; font-weight: 300; color: var(--mid); }

.site-footer {
  background: var(--white); border-top: 1px solid var(--border);
  padding: 20px 28px; text-align: center;
}
.footer-inner { display: flex; justify-content: center; align-items: center; }
.footer-logo { height: 28px; width: auto; opacity: 0.7; }
</style>
